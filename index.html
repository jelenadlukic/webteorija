<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pitanja za maturu</title>
  <meta name="description" content="Izaberi oblast: Web dizajn ili Web programiranje." />
  <link rel="stylesheet" href="./stylepocetna.css" />
</head>

<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <div class="brand">
        <div class="brand__title">Pitanja za maturu</div>
        <div class="brand__sub">Jelena Lukić</div>
      </div>

      <button class="btn btn--ghost" id="logoutBtn" type="button" hidden>Odjava</button>
    </div>
  </header>


  <section class="auth" id="auth">
    <div class="auth__card">
      <h1 class="auth__title">Prijava</h1>
      <p class="auth__desc">Unesi korisničko ime i šifru da pristupiš kvizu.</p>

      <form class="auth__form" id="loginForm" autocomplete="off">
        <label class="field">
          <span class="field__label">Korisničko ime</span>
          <input class="field__input" id="username" type="text" placeholder="Korisničko ime" required />
        </label>

        <label class="field">
          <span class="field__label">Šifra</span>
          <input class="field__input" id="password" type="password" placeholder="Šifra" required />
        </label>

        <div class="auth__error" id="loginError" aria-live="polite"></div>

        <button class="btn btn--primary" type="submit">Uđi</button>
      </form>

      
    </div>
  </section>


  <main class="wrap" id="app" hidden>
    <section class="grid">
      <a class="card tile" href="./webdizajn.html" id="goWebDizajn">
        <h2 class="tile__title">Web dizajn</h2>
        <div class="tile__cta">Otvori kviz</div>
      </a>

      <a class="card tile" href="./webprogramiranje.html" id="goWebProg">
        <h2 class="tile__title">Web programiranje</h2>
        <div class="tile__cta">Otvori kviz</div>
      </a>

      <a class="card tile" href="./baze.html" id="goBaze">
        <h2 class="tile__title">Baze podataka</h2>
        <div class="tile__cta">Otvori kviz</div>
      </a>

      <a class="card tile tile--featured" href="./simulacija-mature.html" id="goSimulacija">
        <h2 class="tile__title">Simulacija mature</h2>
        <p class="tile__desc">10 pitanja iz web dizajna, 10 iz web programiranja i 10 iz baza podataka.</p>
        <div class="tile__cta">Pokreni simulaciju</div>
      </a>
    </section>
  </main>

  <script src="./index.js" defer></script>
</body>
</html>
